<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercado Livre - Mockup</title>

    <style>
      :root {
        --bg: #ffeb3b;
        --accent: #ffe600;
        --card-bg: #fff;
        --muted: #6b6b6b;
        --max-w: 1100px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: #020c3b;
        display: flex;
        justify-content: center;
      }

      .page {
        width: 100%;
        max-width: var(--max-w);
        padding: 28px;
      }

      /* HEADER */
      header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img.logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        border-radius: 10px;
      }

      .brand .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      /* SEARCH (mantida igual ao original) */
      .search-area {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: 8px;
        flex: 1 1 auto;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.95);
        padding: 10px 12px;
        border-radius: 22px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        flex: 1 1 auto;
      }

      .search-box input {
        border: 0;
        outline: 0;
        font-size: 16px;
        flex: 1 1 auto;
        background: transparent;
      }

      .search-box button {
        border: 0;
        background: transparent;
        font-weight: 700;
        cursor: pointer;
      }

      .mic-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        cursor: pointer;
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      }

      /* PRODUCTS — duas colunas fixas e até 3 linhas */
      .products {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .card {
        background: var(--card-bg);
        padding: 12px;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 240px;
      }

      .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
      }

      .card .name {
        font-weight: 700;
      }

      .card .price {
        color: #1a7f1a;
        font-weight: 700;
      }

      .card .seller {
        color: var(--muted);
        font-size: 13px;
      }

      /* Responsivo */
      @media (max-width: 700px) {
        .products {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .card img {
          height: 120px;
        }
        .brand .title {
          font-size: 18px;
        }
      }

      @media (max-width: 480px) {
        .page {
          padding: 16px;
        }
        header {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .search-area {
          width: 100%;
          margin-left: 0;
        }
        .search-box {
          padding: 8px 10px;
        }
      }

      .examples {
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header>
        <div class="brand">
          <img
            class="logo"
            src="https://play-lh.googleusercontent.com/2uEptSnLOcFWnSjxLLIfGOWrf6lWSQ8pheDbGdzhqn0dcV93PBSrUkyjAKPgY7ejmA"
            alt="Logo Mercado Livre"
          />
          <div class="title">Mercado Livre</div>
        </div>

        <div class="search-area">
          <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"
                stroke="#666"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M21 21l-4.35-4.35"
                stroke="#666"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <input
              id="searchInput"
              placeholder="Buscar produtos, marcas e mais..."
            />
            <button id="searchBtn">Buscar</button>
          </div>
          <button id="micBtn" class="mic-btn" title="Pesquisar por voz">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"
                stroke="#333"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M19 11v1a7 7 0 0 1-14 0v-1"
                stroke="#333"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="examples">
        Exemplos de busca:
        <strong>celular, tênis, geladeira, fone bluetooth</strong>
      </div>

      <main>
        <section class="products" id="productsRoot"></section>
      </main>
    </div>

    <script>
      const products = [
        {
          id: 1,
          name: "Iphone 16",
          price: "R$ 4.499,00",
          seller: "Vendido por: LojaTech",
          img: "https://m.media-amazon.com/images/I/71Z-rd+PWgL._AC_SX522_.jpg",
        },
        {
          id: 2,
          name: "Sandália Feminina Sapoti",
          price: "R$ 249,90",
          seller: "Vendido por: SportCenter",
          img: "https://cdn.shoppub.io/cdn-cgi/image/w=1000,h=1000,q=80,f=auto/lojamzq/media/uploads/produtos/foto/yahxkryf/5312-nude.jpg",
        },
        {
          id: 3,
          name: "Geladeira Frost Free 450L",
          price: "R$ 3.199,00",
          seller: "Vendido por: EletroCasa",
          img: "https://d296pbmv9m7g8v.cloudfront.net/Custom/Content/Products/10/73/1073005_refrigerador-geladeira-electrolux-tf71s-480l-2-portas-frost-free-autosense-inox-10010955_l35_638717863491253437.webp",
        },
        {
          id: 4,
          name: "Fone Bluetooth",
          price: "R$ 199,90",
          seller: "Vendido por: AudioShop",
          img: "https://http2.mlstatic.com/D_NQ_NP_2X_832493-MLA95378143521_102025-F.webp",
        },
        {
          id: 5,
          name: "Cafeteira Elétrica",
          price: "R$ 129,90",
          seller: "Vendido por: Casa & Cozinha",
          img: "https://sipolatti.vtexassets.com/arquivos/ids/201880/cafeteira-cp30-inox.jpg?v=638192559420530000",
        },
        {
          id: 6,
          name: "Vaso de planta",
          price: "R$ 599,00",
          seller: "Vendido por: TechWear",
          img: "https://cdn.awsli.com.br/1664/1664922/produto/334141046/22d9be063459177afbdce7ffd22b8151-hnavvz5v0m.jpg",
        },
      ];

      const root = document.getElementById("productsRoot");
      function renderProducts(list) {
        root.innerHTML = "";
        list.forEach((p) => {
          root.innerHTML += `
          <article class="card">
            <img src="${p.img}" alt="${p.name}">
            <div class="name">${p.name}</div>
            <div class="price">${p.price}</div>
            <div class="seller">${p.seller}</div>
          </article>
        `;
        });
      }
      renderProducts(products);
    </script>
  </body>
</html>
